# Site nginx d'EmoVision. Sans nom de domaine : site HTTPS « par défaut » du port 443, servi
# pour les accès par adresse IP, avec un certificat auto-signé (la webcam exige HTTPS).
# Les autres sites du serveur, appelés par leur nom de domaine, ne sont pas concernés.
# Avec un domaine : remplacer server_name et les certificats par ceux de certbot
# (certbot --nginx -d emovision.exemple.org) et retirer default_server.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/emovision/emovision.crt;
    ssl_certificate_key /etc/ssl/emovision/emovision.key;

    client_max_body_size 20M;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(self), microphone=()";

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
