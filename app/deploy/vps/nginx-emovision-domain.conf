# Site nginx d'EmoVision pour son nom de domaine. Le certificat HTTPS (Let's Encrypt) et la
# redirection HTTP -> HTTPS sont ajoutés automatiquement par :
#   certbot --nginx -d emovision.pro -d www.emovision.pro --redirect
server {
    listen 80;
    listen [::]:80;
    server_name emovision.pro www.emovision.pro;

    client_max_body_size 20M;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(self), microphone=()";

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
