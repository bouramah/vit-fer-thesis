# Site nginx d'EmoVision pour emovision.pro (état après certbot --nginx -d emovision.pro
# -d www.emovision.pro --redirect). www.emovision.pro et HTTP redirigent vers https://emovision.pro.
# Certificat Let's Encrypt renouvelé automatiquement par le minuteur certbot.
server {
    server_name emovision.pro www.emovision.pro;

    # www.emovision.pro -> emovision.pro
    if ($host = www.emovision.pro) {
        return 301 https://emovision.pro$request_uri;
    }

    client_max_body_size 20M;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(self), microphone=()";

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/emovision.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/emovision.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.emovision.pro) {
        return 301 https://emovision.pro$request_uri;
    } # managed by Certbot


    if ($host = emovision.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name emovision.pro www.emovision.pro;
    return 404; # managed by Certbot




}